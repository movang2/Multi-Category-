name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment & keystore
        run: |
          # Tạo file .env nếu chưa có
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Phục hồi debug.keystore nếu có file base64 hoặc tạo mới nếu chưa có
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Khôi phục debug.keystore từ debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Tạo debug.keystore mới bằng keytool..."
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Cấp quyền thực thi cho gradlew
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK for easier download
        run: |
          mkdir -p build-apks
          cp app/build/outputs/apk/debug/app-debug.apk build-apks/MultiCategoryNotes-debug.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiCategoryNotes-debug-apk
          path: build-apks/MultiCategoryNotes-debug.apk
          retention-days: 30

      - name: Create GitHub Release (khi tạo git tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/MultiCategoryNotes-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
